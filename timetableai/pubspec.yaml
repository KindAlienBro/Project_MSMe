name: timetableai
description: "TimetableAI - Smart Timetable Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.8.0+1

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.2.4

  # State Management
  provider: ^6.1.5

  # Typography
  google_fonts: ^6.2.1

  # Charts for dashboard
  fl_chart: ^0.70.2

  # Loading skeletons
  shimmer: ^3.0.0

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
